<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 若站点以 https 提供，可开启下面这行把 http 子资源自动升级为 https
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%VITE_SITE_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_SITE_APPLE_LOGO%" />
    <link rel="bookmark" href="%VITE_SITE_APPLE_LOGO%" />
    <link rel="apple-touch-icon-precomposed" sizes="200x200" href="%VITE_SITE_APPLE_LOGO%" />
    <meta name="description" content="%VITE_SITE_DES%" />
    <meta name="keywords" content="%VITE_SITE_KEYWORDS%" />
    <meta name="author" content="%VITE_SITE_AUTHOR%" />
    <meta name="theme-color" content="#424242" />
    <!-- 社交分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_SITE_NAME%" />
    <meta property="og:description" content="%VITE_SITE_DES%" />
    <meta property="og:url" content="https://dxhyyds.top/" />
    <meta property="og:image" content="/images/icon/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://dxhyyds.top/" />
    <title>%VITE_SITE_NAME%</title>
    <!-- HarmonyOS Sans -->
    <link rel="preconnect" href="https://s1.hdslb.com" crossorigin />
    <link rel="stylesheet" href="https://s1.hdslb.com/bfs/static/jinkela/long/font/regular.css" />
    <!-- 预加载首屏字体 -->
    <link
      rel="preload"
      href="/font/Pacifico-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  
    <!-- IE Out -->
    <script>
      if (/*@cc_on!@*/ false || (!!window.MSInputMethodContext && !!document.documentMode))
        window.location.href =
          'https://support.dmeng.net/upgrade-your-browser.html?referrer=' +
          encodeURIComponent(window.location.href);
    </script>
  </head>

  <body>
    <!-- 主体内容 -->
    <div id="app"></div>
    <!-- noscript -->
    <noscript>
      <div style="text-align: center">请开启 JavaScript</div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
